[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
repository = "https://github.com/alan13367/nibble-rs"

# nibble has a strict zero-dependency policy: only path dependencies between
# workspace crates are allowed. See PLAN.md, "Dependency policy".
[workspace.dependencies]
nibble-gguf = { path = "crates/nibble-gguf", version = "0.1.0" }
nibble = { path = "crates/nibble", version = "0.1.0" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# `cargo build --profile profiling` for samply / AMD uProf: release speed with line tables.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
